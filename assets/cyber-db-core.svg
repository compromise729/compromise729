<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">compromise729 / Database Systems</title>
<desc id="desc">Encrypted database research, RMDB internals and information security. Animated abstract database core.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e1d"/><stop offset="1" stop-color="#12112c"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#52e2d4"/><stop offset=".5" stop-color="#74bbf4"/><stop offset="1" stop-color="#ad8cff"/></linearGradient>
  <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#193748" stop-opacity=".85"/><stop offset="1" stop-color="#30234d" stop-opacity=".5"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#7960ce" stop-opacity=".2"/><stop offset="1" stop-color="#7960ce" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#70829d" stroke-opacity=".08"/></pattern>
  <clipPath id="frame"><rect x="1" y="1" width="1198" height="458" rx="18"/></clipPath>
</defs>
<style>
.mono{font-family:Consolas,Menlo,monospace}.sans{font-family:Arial,Helvetica,sans-serif}
.query{stroke-dasharray:8 14;animation:travel 10s linear infinite}.orbit{transform-origin:937px 219px;animation:rotate 36s linear infinite}.signal{animation:pulse 4s ease-in-out infinite}
@keyframes travel{to{stroke-dashoffset:-220}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.query,.orbit,.signal{animation:none}}
</style>
<g clip-path="url(#frame)">
